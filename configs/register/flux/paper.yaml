task: train-register
backbone:
  name: flux
  model_name_or_path: black-forest-labs/FLUX.1-dev
  revision: c8c84018e
  embedded_guidance_scale: 3.5
register:
  # Two heads only (unified_v3): preference <- teacher_score_zscore (HPSv3),
  # imagereward <- imagereward_score. Order must match score_keys.
  head_names: [preference, imagereward]
  score_keys: [teacher_score_zscore, imagereward_score]
  # Depth rule (1/6, 1/3, 1/2): FLUX 9/19/28 of 57 (19 double + 38 single).
  # Tap 19 is the last double-stream block.
  feature_layers: [9, 19, 28]
  text_layers: [9, 19, 28]
  num_transformer_layers: 28
  architecture: flux_latent_reward_grid_pool_nope_multihead
  head_hidden_factor: 2
  layer_index_base: 1
  num_reward_tokens: 32
  num_attn_heads: 8
  pool_factor: 4
  vis_h: 64
  vis_w: 64
  width: -1
  dropout: 0.0
  use_proj_in: false
  use_self_attn: true
train:
  epochs: 3
  global_batch_size: 32
  precision: bf16
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_steps: 1000
  ema_decay: 0.999
  max_grad_norm: 1.0

