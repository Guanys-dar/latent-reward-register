task: train-register
backbone:
  name: z-image
  model_name_or_path: Tongyi-MAI/Z-Image-Turbo
  revision: c8c84018e
register:
  # Two heads only (unified_v3): preference <- teacher_score_zscore (HPSv3),
  # imagereward <- imagereward_score. Order must match score_keys.
  head_names: [preference, imagereward]
  score_keys: [teacher_score_zscore, imagereward_score]
  # Depth rule (1/6, 1/3, 1/2): Z-Image 5/10/15 of 30.
  feature_layers: [5, 10, 15]
  text_layers: [5, 10, 15]
  num_transformer_layers: 15
  architecture: zimage_latent_reward_grid_pool_nope_multihead
  head_hidden_factor: 2
  layer_index_base: 1
  num_reward_tokens: 32
  num_attn_heads: 8
  pool_factor: 4
  # Visual snapshot grid in TOKENS, not pixels (1024x1024).
  # The pooling layer asserts vis_h*vis_w tokens, so latent spatial size
  # must match: a smaller input fails rather than silently rescaling.
  vis_h: 64
  vis_w: 64
  width: -1
  dropout: 0.0
  use_proj_in: false
  use_self_attn: true
  noise_convention: native_t_equals_one_minus_sigma
train:
  epochs: 3
  global_batch_size: 32
  precision: bf16
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_steps: 1000
  ema_decay: 0.999
  max_grad_norm: 1.0

