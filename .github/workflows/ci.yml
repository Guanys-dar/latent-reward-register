name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The CPU extra on purpose: the whole algorithm layer is testable without
      # CUDA, and installing a GPU torch build here would cost minutes and prove
      # nothing extra.
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev]'

      # An editable install, not PYTHONPATH: this is the path the README tells a
      # reader to use, so it is the one worth proving.
      - name: Tests
        run: pytest -q

      - name: Lint
        run: ruff check src tests release scripts

      - name: Config presets resolve
        run: lrr validate-release --root .

      - name: Algorithm paths run without weights
        run: lrr smoke-release

      - name: Every preset resolves to a runnable plan
        run: |
          for config in configs/register/*/paper.yaml; do
            lrr train-register --config "$config" --dry-run > /dev/null
          done
          for config in configs/rgs/*/paper.yaml; do
            lrr sample --config "$config" --dry-run > /dev/null
          done
          for config in configs/rgopd/*/paper.yaml; do
            lrr train-rgopd --config "$config" --dry-run > /dev/null
          done

      # Proves the public tree is self-contained: it must pass the same suite
      # after the private-only files are stripped out.
      - name: Exported tree is self-contained
        run: |
          python release/export.py --out /tmp/public
          cd /tmp/public
          pip install -e '.[dev]'
          pytest -q
